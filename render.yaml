services:
  - type: web
    name: iubat-student-service-shakkhor
    runtime: docker
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeploy: false
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: RENDER
        value: "true"
      - key: DOTNET_USE_POLLING_FILE_WATCHER
        value: "true"
      - key: DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE
        value: "false"
      - key: ConnectionStrings__DefaultConnection
        sync: false
      # Also accepts DATABASE_URL (Neon URL format) as fallback — set either one.
      - key: DATABASE_URL
        sync: false
